name: Quality

# Lives at the repository root because the root is now the git repository.
# It previously sat under web/.github/, which GitHub only honoured while web/
# was its own repository (ROADMAP S-0, B-15).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # `next build` prerenders the client components, which evaluates
      # src/lib/supabase.ts, so these must exist or the build throws. They are
      # syntactically valid placeholders and no request is made at build time.
      # Real values live in Vercel's environment settings.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  android:
    name: Android — unit tests, lint, assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # AppContainer treats a non-https URL as "not configured" and swaps in
      # no-op repositories, so the app still builds without real credentials.
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # No SDK setup step: ubuntu-latest ships an Android SDK with licenses
      # accepted, and AGP downloads any missing platform itself.
      # android-actions/setup-android@v3 installed the legacy `tools` package by
      # default, which Google has removed, so sdkmanager failed before Gradle ran.

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, assemble
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee gradle.log

      # Job logs require a GitHub login, but annotations are public and appear on
      # the commit page, so surface the actual Gradle error as annotations.
      - name: Annotate Gradle failure
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          escape() { local m="${1//'%'/'%25'}"; m="${m//$'\r'/}"; printf '%s' "${m//$'\n'/'%0A'}"; }
          # Kotlin compiler errors look like: "e: file:///abs/path/File.kt:12:5 message"
          grep -E '^e: ' gradle.log | head -10 | while IFS= read -r line; do
            echo "::error title=Kotlin compile error::$(escape "${line#e: file://$GITHUB_WORKSPACE/}")"
          done
          summary=$(awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' gradle.log | head -40)
          [ -n "$summary" ] && echo "::error title=Gradle failure::$(escape "$summary")"
          # Failed unit tests: name and assertion message from the JUnit XML.
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      detail = bad.get('message') or (bad.text or '').strip().split('\n')[0]
                      text = f"{case.get('classname')}.{case.get('name')}: {detail[:800]}"
                      text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f'::error title=Unit test failed::{text}')
          PY
          exit 0

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
